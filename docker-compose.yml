services:
  # PostgreSQL 데이터베이스
  postgres:
    image: postgres:13-alpine
    container_name: smw-postgres
    environment:
      POSTGRES_DB: smw_db
      POSTGRES_USER: smw_user
      POSTGRES_PASSWORD: smw_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smw_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smw-network

  # Spring Boot 애플리케이션
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smw-app
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:log4jdbc:postgresql://postgres:5432/smw_db
      SPRING_DATASOURCE_USERNAME: smw_user
      SPRING_DATASOURCE_PASSWORD: smw_password
      SPRING_DATASOURCE_HIKARI_USERNAME: smw_user
      SPRING_DATASOURCE_HIKARI_PASSWORD: smw_password
      # Grafana OpenTelemetry — 토큰은 .env 파일로 주입 (절대 커밋 금지)
      OTEL_SERVICE_NAME: smwr
      OTEL_EXPORTER_OTLP_ENDPOINT: https://otlp-gateway-prod-ap-northeast-0.grafana.net/otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # OTEL_EXPORTER_OTLP_HEADERS: K8s 환경에서는 smw-otel-secret 으로 주입. 로컬 테스트 시만 .env 사용
      # Grafana iframe 프록시 (관리자 /admin/monitoring) — .env 의 SMW_GRAFANA_CLOUD_* 참조
      SMW_GRAFANA_CLOUD_ENABLED: ${SMW_GRAFANA_CLOUD_ENABLED:-false}
      SMW_GRAFANA_CLOUD_BASE_URL: ${SMW_GRAFANA_CLOUD_BASE_URL:-https://sjrtjr3150.grafana.net}
      SMW_GRAFANA_CLOUD_ACCESS_TOKEN: ${SMW_GRAFANA_CLOUD_ACCESS_TOKEN:-}
      SMW_GRAFANA_DASHBOARD_WAS_UID: ${SMW_GRAFANA_DASHBOARD_WAS_UID:-}
      SMW_GRAFANA_DASHBOARD_BATCH_UID: ${SMW_GRAFANA_DASHBOARD_BATCH_UID:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smw-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  smw-network:
    driver: bridge

