name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      k8s_rollout_mode:
        description: 'staged=메모리 절약(batch 0→app→batch 1→목표 replica), parallel=app·batch 동시 교체(기본)'
        type: choice
        options:
          - parallel
          - staged
        default: parallel

env:
  # GitHub Actions: Node 20 기반 액션 폐기 대비 (2026년 기본값 Node 24)
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-hosted-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_API_IMAGE: gilhwanjeon/smw-app
  DOCKER_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean package -DskipTests -T 1C  # 단일 스레드로 빌드하여 리소스 사용량 감소

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata for API Docker image
      id: meta-api
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.DOCKER_API_IMAGE }}
        tags: |
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=${{ github.run_number }}

    - name: Build and push API Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/arm64  # EC2 인스턴스가 ARM64 아키텍처를 사용하므로 ARM64로 빌드
        push: true
        tags: ${{ steps.meta-api.outputs.tags }}
        labels: ${{ steps.meta-api.outputs.labels }}
        cache-from: type=registry,ref=${{ env.DOCKER_API_IMAGE }}:latest
        cache-to: type=inline
        build-args: |
          BUILDKIT_INLINE_CACHE=1

  deploy-to-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    env:
      IMAGE_TAG: main-${{ github.sha }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # SSH 키를 파일로 저장 (멀티라인 처리)
        # 개행 문자 제거 및 형식 정리
        echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/ec2_key
        chmod 600 ~/.ssh/ec2_key
        
        # SSH 키 형식 검증
        echo "=== SSH 키 검증 ==="
        head -1 ~/.ssh/ec2_key
        if ! grep -q "BEGIN.*PRIVATE KEY" ~/.ssh/ec2_key; then
          echo "ERROR: SSH 키 형식이 올바르지 않습니다."
          exit 1
        fi
        
        # EC2 호스트 키 추가 (재시도 로직 포함)
        echo "=== EC2 호스트 키 추가 ==="
        for i in {1..5}; do
          if ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>&1; then
            echo "호스트 키 추가 성공"
            break
          else
            echo "호스트 키 추가 실패, 재시도 $i/5..."
            sleep 2
          fi
        done
        
        # SSH 연결 테스트
        echo "=== SSH 연결 테스트 ==="
        for i in {1..3}; do
          if ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=3 \
            ubuntu@${{ secrets.EC2_HOST }} \
            "echo 'SSH 연결 성공'" 2>&1; then
            echo "SSH 연결 테스트 성공"
            break
          else
            echo "SSH 연결 테스트 실패, 재시도 $i/3..."
            sleep 5
            if [ $i -eq 3 ]; then
              echo "ERROR: SSH 연결에 실패했습니다."
              exit 1
            fi
          fi
        done

    - name: Resolve K8s rollout mode
      id: k8s_rollout
      # parallel: 기본(push). workflow_dispatch: inputs. push + repo var K8S_STAGED_ROLLOUT=true: staged
      env:
        GEVENT: ${{ github.event_name }}
        WDISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.k8s_rollout_mode || '' }}
        STVAR: ${{ vars.K8S_STAGED_ROLLOUT }}
      run: |
        if [ "$GEVENT" = "workflow_dispatch" ] && [ -n "$WDISPATCH" ]; then
          echo "mode=$WDISPATCH" >> "$GITHUB_OUTPUT"
        elif [ "$GEVENT" = "push" ] && [ "$STVAR" = "true" ]; then
          echo "mode=staged" >> "$GITHUB_OUTPUT"
        else
          echo "mode=parallel" >> "$GITHUB_OUTPUT"
        fi

    - name: Deploy to Kubernetes via SSH
      env:
        K8S_ROLLOUT_MODE: ${{ steps.k8s_rollout.outputs.mode }}
      run: |
        echo "K8S_ROLLOUT_MODE=$K8S_ROLLOUT_MODE IMAGE_TAG=$IMAGE_TAG"
        ( printf 'export K8S_ROLLOUT_MODE=%q\n' "$K8S_ROLLOUT_MODE"
          printf 'export IMAGE_TAG=%q\n' "$IMAGE_TAG"
          cat k8s/scripts/remote-k8s-deploy.sh
        ) | ssh -i ~/.ssh/ec2_key \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=~/.ssh/known_hosts \
          -o ConnectTimeout=30 \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          -o TCPKeepAlive=yes \
          -o BatchMode=yes \
          ubuntu@${{ secrets.EC2_HOST }} 'bash -s'


