name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:  # 수동 실행도 가능하도록

env:
  # GitHub Actions: Node 20 기반 액션 폐기 대비 (2026년 기본값 Node 24)
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-hosted-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_API_IMAGE: gilhwanjeon/smw-app
  DOCKER_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean package -DskipTests -T 1C  # 단일 스레드로 빌드하여 리소스 사용량 감소

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata for API Docker image
      id: meta-api
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.DOCKER_API_IMAGE }}
        tags: |
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=${{ github.run_number }}

    - name: Build and push API Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/arm64  # EC2 인스턴스가 ARM64 아키텍처를 사용하므로 ARM64로 빌드
        push: true
        tags: ${{ steps.meta-api.outputs.tags }}
        labels: ${{ steps.meta-api.outputs.labels }}
        cache-from: type=registry,ref=${{ env.DOCKER_API_IMAGE }}:latest
        cache-to: type=inline
        build-args: |
          BUILDKIT_INLINE_CACHE=1

  deploy-to-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    env:
      IMAGE_TAG: main-${{ github.sha }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # SSH 키를 파일로 저장 (멀티라인 처리)
        # 개행 문자 제거 및 형식 정리
        echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/ec2_key
        chmod 600 ~/.ssh/ec2_key
        
        # SSH 키 형식 검증
        echo "=== SSH 키 검증 ==="
        head -1 ~/.ssh/ec2_key
        if ! grep -q "BEGIN.*PRIVATE KEY" ~/.ssh/ec2_key; then
          echo "ERROR: SSH 키 형식이 올바르지 않습니다."
          exit 1
        fi
        
        # EC2 호스트 키 추가 (재시도 로직 포함)
        echo "=== EC2 호스트 키 추가 ==="
        for i in {1..5}; do
          if ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>&1; then
            echo "호스트 키 추가 성공"
            break
          else
            echo "호스트 키 추가 실패, 재시도 $i/5..."
            sleep 2
          fi
        done
        
        # SSH 연결 테스트
        echo "=== SSH 연결 테스트 ==="
        for i in {1..3}; do
          if ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=3 \
            ubuntu@${{ secrets.EC2_HOST }} \
            "echo 'SSH 연결 성공'" 2>&1; then
            echo "SSH 연결 테스트 성공"
            break
          else
            echo "SSH 연결 테스트 실패, 재시도 $i/3..."
            sleep 5
            if [ $i -eq 3 ]; then
              echo "ERROR: SSH 연결에 실패했습니다."
              exit 1
            fi
          fi
        done

    - name: Deploy to Kubernetes via SSH
      # 타임아웃 제거 (배포 작업이 완료될 때까지 대기)
      # timeout-minutes: 20
      run: |
        ssh -i ~/.ssh/ec2_key \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=~/.ssh/known_hosts \
          -o ConnectTimeout=30 \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          -o TCPKeepAlive=yes \
          -o BatchMode=yes \
          ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
          # set -e 제거 (일부 명령어 실패해도 계속 진행)
          cd ~/SMWR_WAS || { echo "ERROR: SMWR_WAS 디렉토리로 이동 실패"; exit 1; }
          
          # Git 저장소 설정 (없는 경우)
          if [ ! -d .git ]; then
            echo "=== Git 저장소 초기화 ==="
            git init || echo "Git init 실패 (무시)"
            git remote add origin https://github.com/jgh9514/SMWR_WAS.git 2>/dev/null || \
            git remote set-url origin https://github.com/jgh9514/SMWR_WAS.git 2>/dev/null || \
            echo "Git remote 설정 실패 (무시)"
          fi
          
          # 최신 코드 가져오기 (재시도 로직 포함, 실패해도 계속 진행)
          echo "=== 최신 코드 가져오기 ==="
          GIT_FETCH_SUCCESS=false
          for i in {1..5}; do
            if timeout 30 git fetch origin main 2>&1; then
              echo "Git fetch 성공"
              GIT_FETCH_SUCCESS=true
              break
            else
              echo "Git fetch 실패, 재시도 $i/5... (5초 대기)"
              sleep 5
            fi
          done
          
          # 로컬 브랜치 업데이트 (fetch가 성공한 경우만)
          if [ "$GIT_FETCH_SUCCESS" = "true" ] && git rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "=== 로컬 브랜치 업데이트 ==="
            git reset --hard origin/main 2>&1 || \
            git checkout -B main origin/main 2>&1 || \
            { echo "ERROR: Git reset 실패 — 오염된 파일로 배포 불가"; exit 1; }
          else
            echo "WARNING: Git fetch 실패 또는 origin/main 브랜치를 찾을 수 없음, 기존 코드 사용"
          fi
          
          # 현재 Git 상태 확인
          echo "=== 현재 Git 상태 ==="
          git log --oneline -1 2>/dev/null || echo "Git 로그 확인 실패"
          git status --short 2>/dev/null || echo "Git 상태 확인 실패"
          
          KUBECTL="sudo k3s kubectl"
          
          # K3s 클러스터 상태 확인 (호스트 이름 해석 오류 무시)
          echo "=== K3s 클러스터 상태 확인 ==="
          # 호스트 이름 해석 오류를 무시하기 위해 환경 변수 설정
          export DEBIAN_FRONTEND=noninteractive
          sudo systemctl status k3s --no-pager 2>/dev/null | head -5 || echo "K3s 서비스 상태 확인 실패 (무시)"
          
          # kubectl이 작동하는지 확인
          echo "=== kubectl 클러스터 정보 확인 ==="
          ${KUBECTL} cluster-info --request-timeout=20s || {
            echo "k3s kubectl cluster-info 실패"
            exit 1
          }
          
          # kubectl 버전 및 노드 확인
          ${KUBECTL} version --client --request-timeout=20s || echo "kubectl version 확인 실패"
          ${KUBECTL} get nodes --request-timeout=20s || {
            echo "노드 확인 실패"
            exit 1
          }
          
          # 최신 이미지로 업데이트 (SHA 기반 태그 사용)
          echo "=== 이미지 태그 업데이트 ==="
          if [ -f k8s/deployment.yaml ]; then
            IMAGE_TAG="${IMAGE_TAG:-latest}"
            sed -i "s|image: gilhwanjeon/smw-app:.*|image: gilhwanjeon/smw-app:${IMAGE_TAG}|g" k8s/deployment.yaml
            echo "이미지 태그 업데이트 완료: ${IMAGE_TAG}"
            grep "image:" k8s/deployment.yaml || echo "이미지 태그 확인 실패"
          else
            echo "WARNING: k8s/deployment.yaml 파일을 찾을 수 없음"
          fi
          
          # Redis 배포 (smw-app·smw-batch 보다 먼저 기동되어야 함)
          echo "=== Redis 배포 ==="
          if [ -f k8s/redis.yaml ]; then
            ${KUBECTL} apply -f k8s/redis.yaml --request-timeout=180s || {
              echo "WARNING: redis 적용 실패"
            }
          else
            echo "WARNING: k8s/redis.yaml 파일을 찾을 수 없음"
          fi
          
          # 백엔드(API) 배포
          echo "=== 배포 시작 ==="
          if [ -f k8s/deployment.yaml ]; then
            ${KUBECTL} apply -f k8s/deployment.yaml --request-timeout=180s || {
              echo "배포 실패, 재시도 중..."
              sleep 5
              ${KUBECTL} apply -f k8s/deployment.yaml --request-timeout=180s || {
                echo "ERROR: 배포 실패"
                exit 1
              }
            }
            if [ -f k8s/smwr-backend-ingress.yaml ]; then
              ${KUBECTL} apply -f k8s/smwr-backend-ingress.yaml --request-timeout=180s || {
                echo "WARNING: backend ingress 적용 실패"
              }
            fi
          else
            echo "ERROR: k8s/deployment.yaml 파일이 없습니다."
            exit 1
          fi
          
          # 배치 서버 배포
          echo "=== 배치 서버 배포 ==="
          if [ -f k8s/batch-deployment.yaml ]; then
            ${KUBECTL} apply -f k8s/batch-deployment.yaml --request-timeout=180s || {
              echo "WARNING: batch 배포 실패, 재시도 중..."
              sleep 5
              ${KUBECTL} apply -f k8s/batch-deployment.yaml --request-timeout=180s || {
                echo "WARNING: batch 배포 최종 실패 (API 배포는 계속 진행)"
              }
            }
          else
            echo "WARNING: k8s/batch-deployment.yaml 파일을 찾을 수 없음"
          fi
          
          echo "=== Pod 재시작 (최신 이미지 적용) ==="
          for DEPLOY in smw-app smw-batch; do
            ${KUBECTL} rollout restart deployment/${DEPLOY} --request-timeout=180s || {
              echo "WARNING: ${DEPLOY} rollout restart 실패, Pod 직접 삭제 시도"
              ${KUBECTL} delete pod -l app=${DEPLOY} --request-timeout=180s || {
                echo "WARNING: ${DEPLOY} Pod 삭제 실패, 새 배포일 수 있음"
              }
            }
          done
          
          # 배포 상태 확인
          echo "=== 배포 상태 확인 ==="
          ${KUBECTL} get pods --request-timeout=30s || {
            echo "WARNING: Pod 상태 확인 실패"
          }
          ${KUBECTL} get services --request-timeout=30s || {
            echo "WARNING: Service 상태 확인 실패"
          }
          
          echo "=== 배포 완료 대기 (최대 5분) ==="
          for DEPLOY in smw-app smw-batch; do
            ${KUBECTL} rollout status deployment/${DEPLOY} --timeout=5m || {
              echo "WARNING: ${DEPLOY} 배포 완료 대기 시간 초과"
              echo "현재 Pod 상태:"
              ${KUBECTL} get pods -l app=${DEPLOY} --request-timeout=30s || echo "Pod 상태 확인 실패"
            }
          done
          
          # 최종 상태 확인
          echo "=== 최종 배포 상태 ==="
          ${KUBECTL} get pods -l app=smw-app -o wide --request-timeout=30s || echo "Pod 상태 확인 실패 (무시)"
          
          # Pod 상태 상세 확인
          echo "=== Pod 상세 상태 ==="
          for APP_LABEL in smw-app smw-batch smw-redis; do
            POD_NAME=$(${KUBECTL} get pods -l app=${APP_LABEL} -o jsonpath='{.items[0].metadata.name}' --request-timeout=15s 2>/dev/null || echo "")
            if [ -n "$POD_NAME" ] && [ "$POD_NAME" != "null" ]; then
              echo "Pod 이름: $POD_NAME"
              ${KUBECTL} describe pod $POD_NAME --request-timeout=30s 2>/dev/null | grep -A 10 "Status\|State\|Ready\|Image" || echo "Pod 상세 정보 확인 실패"
              echo "=== ${APP_LABEL} Pod 로그 확인 (최근 10줄) ==="
              ${KUBECTL} logs --tail=10 $POD_NAME --request-timeout=15s 2>/dev/null || echo "로그 확인 실패 (무시)"
            else
              echo "${APP_LABEL} Pod를 찾을 수 없습니다. (무시)"
            fi
          done
          
          # 배포 성공 여부 확인
          echo "=== 배포 성공 여부 확인 ==="
          API_READY_PODS=$(${KUBECTL} get pods -l app=smw-app -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' --request-timeout=15s 2>/dev/null | wc -w)
          BATCH_READY_PODS=$(${KUBECTL} get pods -l app=smw-batch -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' --request-timeout=15s 2>/dev/null | wc -w)
          if [ "$API_READY_PODS" -gt 0 ]; then
            echo "✅ 배포 성공: api=${API_READY_PODS}개, batch=${BATCH_READY_PODS}개 Pod가 Running 상태입니다."
          else
            echo "❌ 배포 실패: api=${API_READY_PODS}개 Pod가 Running 상태입니다."
            exit 1
          fi
          
          echo "=== 배포 작업 완료 ==="
        EOF


