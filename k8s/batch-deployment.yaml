# 동일 이미지(smw-app): Quartz 크론·RTA 배치만 이 Pod 에서 실행. API Pod(smw-app)와 DB·Redis 공유.
# quartz-jdbc 프로필: QRTZ JDBC 클러스터(application-quartz-jdbc.yml). QRTZ_* DDL 선행. (replicas>1 이어도 클러스터 동일)
# 대량 Pod 교체·순차 롤아웃: DEPLOYMENT_ROLLOUT.md
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smw-batch
  labels:
    app: smw-batch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smw-batch
  template:
    metadata:
      labels:
        app: smw-batch
    spec:
      containers:
        - name: smw-batch
          image: gilhwanjeon/smw-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_REGION
            - name: SPRING_PROFILES_ACTIVE
              value: "docker,quartz-jdbc"
            # yml profile 병합·이미지 캐시 등으로 job-store-type 이 빠질 때 RAM+JDBC prop 충돌 방지( LocalDataSourceJobStore 와 짝)
            - name: SPRING_QUARTZ_JOB_STORE_TYPE
              value: "jdbc"
            - name: TZ
              value: "Asia/Seoul"
            # limit 1024Mi: Metaspace 256m + 힙 512m (128m Metaspace cap 은 기동 OOM). OTEL agent OFF.
            - name: JAVA_TOOL_OPTIONS
              value: "-Duser.timezone=Asia/Seoul -Xms384m -Xmx512m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=64m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
            - name: SMW_GRAFANA_OTEL_ENABLED
              value: "false"
            # 장시간 집계(랭킹 스냅 CTE): 기본 600s·2400s 로는 4h+ 실행 시 Connection closed → rollback 실패
            - name: SPRING_DATASOURCE_SOCKET_TIMEOUT
              value: "21600"
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "8"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "4"
            - name: SERVER_TOMCAT_THREADS_MAX
              value: "20"
            - name: SERVER_TOMCAT_THREADS_MIN_SPARE
              value: "5"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: smw-db-secret
                  key: url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smw-db-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smw-db-secret
                  key: password
            - name: SPRING_DATASOURCE_HIKARI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smw-db-secret
                  key: username
            - name: SPRING_DATASOURCE_HIKARI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smw-db-secret
                  key: password
            - name: SPRING_MAIL_ENABLED
              valueFrom:
                secretKeyRef:
                  name: smw-mail-secret
                  key: enabled
                  optional: true
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smw-mail-secret
                  key: username
                  optional: true
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smw-mail-secret
                  key: password
                  optional: true
            - name: SPRING_MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: smw-mail-secret
                  key: from
                  optional: true
            - name: SMW_JWT_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: smw-app-secret
                  key: jwt-signing-secret
                  optional: true
            - name: SMW_JWT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: smw-app-secret
                  key: jwt-encryption-key
                  optional: true
            # Grafana OpenTelemetry
            - name: OTEL_SERVICE_NAME
              value: "smwr-batch"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: smw-otel-secret
                  key: otlp-endpoint
                  optional: true
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              valueFrom:
                secretKeyRef:
                  name: smw-otel-secret
                  key: otlp-protocol
                  optional: true
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: smw-otel-secret
                  key: otlp-headers
                  optional: true
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            - name: OTEL_LOG_LEVEL
              value: "warn"
            - name: OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT
              value: "8192"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=production,service.namespace=smwr"
            - name: SMW_BATCH_QUARTZ_ENABLED
              value: "true"
            - name: SPRING_QUARTZ_AUTO_STARTUP
              value: "true"
            - name: SMW_SCHEDULER_ENABLED
              value: "true"
            - name: SPRING_DATA_REDIS_HOST
              value: "smw-redis"
            - name: SMW_CACHE_RTA_USE_REDIS
              value: "true"
            # 시너지: 예전 운영(≈1000경기·1라운드/Job) — 5000×3라운드 catch-up 은 Job 5~12h 원인
            - name: SMW_RTA_SYNERGY_BATCH_SIZE
              value: "1000"
            - name: SMW_RTA_SYNERGY_MAX_ROUNDS_CAP
              value: "1"
            - name: SMW_RTA_BATCH_BACKLOG_SCALING
              value: "false"
            - name: SMW_RTA_BATCH_EXACT_PENDING_COUNT_IN_JOBS
              value: "false"
            - name: SMW_RTA_BATCH_PENDING_COUNT_CACHE_TTL
              value: "300"
            - name: SMW_RTA_PICK_SLOT_MAX_ROUNDS_CAP
              value: "3"
            - name: SMW_RTA_PICK_SLOT_DRAIN_BATCH_SIZE
              value: "1000"
            - name: SMW_RTA_RAW_APPLY_MAX_ROWS
              value: "500"
            - name: SMW_RTA_RAW_APPLY_MAX_BATCHES_CAP
              value: "5"
            - name: SMW_RTA_SYNERGY_AGG_COPY_STAGING_CHUNK_ROWS
              value: "100000"
            - name: SMW_RTA_COUNTER_AGG_COPY_STAGING_CHUNK_ROWS
              value: "80000"
            - name: SMW_RTA_COUNTER_AGG_ANALYZE_AFTER_MERGE
              value: "false"
            - name: SMW_RTA_SYNERGY_PAUSE_MS
              value: "150"
            # 단일 Job 10h+ 점유 방지 — docker yml 3h 상한과 동일
            - name: SMW_RTA_SYNERGY_MAX_WALL_CLOCK_MS
              value: "10800000"
            - name: SMW_RTA_SYNERGY_APPLY_SUB_BATCH_SIZE
              value: "800"
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "1024Mi"
              cpu: "1500m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: smw-batch-service
  labels:
    app: smw-batch
spec:
  type: ClusterIP
  selector:
    app: smw-batch
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
