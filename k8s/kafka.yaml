# Kafka (KRaft 모드) - K8s 클러스터 내부 배포용
# AWS MSK 등 외부 Kafka 사용 시 이 파일은 적용하지 않음
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smwr-kafka
  labels:
    app: smwr-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smwr-kafka
  template:
    metadata:
      labels:
        app: smwr-kafka
    spec:
      containers:
      - name: kafka
        image: bitnami/kafka:3.6
        ports:
        - containerPort: 9092
          name: kafka
        - containerPort: 9093
          name: controller
        env:
        - name: KAFKA_CFG_NODE_ID
          value: "0"
        - name: KAFKA_CFG_PROCESS_ROLES
          value: "controller,broker"
        - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
          value: "0@smwr-kafka:9093"
        - name: KAFKA_CFG_LISTENERS
          value: "PLAINTEXT://:9092,CONTROLLER://:9093"
        - name: KAFKA_CFG_ADVERTISED_LISTENERS
          value: "PLAINTEXT://smwr-kafka:9092"
        - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
          value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
        - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT"
        - name: ALLOW_PLAINTEXT_LISTENER
          value: "yes"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: kafka-data
          mountPath: /bitnami/kafka
      volumes:
      - name: kafka-data
        emptyDir: {}  # 단일 레플리카용. 영구 저장 필요 시 PVC 사용
---
apiVersion: v1
kind: Service
metadata:
  name: smwr-kafka
  labels:
    app: smwr-kafka
spec:
  type: ClusterIP
  selector:
    app: smwr-kafka
  ports:
  - port: 9092
    targetPort: 9092
    protocol: TCP
    name: kafka
  - port: 9093
    targetPort: 9093
    protocol: TCP
    name: controller
