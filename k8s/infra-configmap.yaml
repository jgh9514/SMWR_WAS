# Redis, Kafka 연결 정보
# - K8s 내부 배포 시: redis-host, kafka-bootstrap-servers는 Service 이름 사용
# - 외부(ElastiCache, MSK 등) 사용 시: 해당 호스트/엔드포인트로 수정
apiVersion: v1
kind: ConfigMap
metadata:
  name: smw-infra-config
  labels:
    app: smw-app
data:
  redis.host: "smwr-redis"
  redis.port: "6379"
  kafka.bootstrap-servers: "smwr-kafka:9092"
  cache.provider: "redis"
  kafka.enabled: "true"
