apiVersion: v1
kind: Secret
metadata:
  name: smw-db-secret
type: Opaque
stringData:
  url: "jdbc:postgresql://<host>:5432/<database>"
  username: "<db-username>"
  password: "<db-password>"
---
apiVersion: v1
kind: Secret
metadata:
  name: smw-mail-secret
type: Opaque
stringData:
  enabled: "false"
  username: "<mail-username>"
  password: "<mail-password>"
  from: "noreply@example.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: smw-app-secret
type: Opaque
stringData:
  jwt-signing-secret: "<replace-with-long-random-signing-secret>"
  jwt-encryption-key: "<16-or-24-or-32-char-key>"
---
apiVersion: v1
kind: Secret
metadata:
  name: smw-otel-secret
type: Opaque
stringData:
  otlp-headers: "Authorization=Basic <base64_encoded_userid:token>"
---
apiVersion: v1
kind: Secret
metadata:
  name: smw-grafana-secret
type: Opaque
stringData:
  # Grafana Cloud Access Policy token (glsa_...) — git·이미지에 넣지 말 것
  access-token: "<grafana-cloud-access-policy-token>"
