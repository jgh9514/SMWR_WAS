apiVersion: v1
kind: Secret
metadata:
  name: smw-db-secret
type: Opaque
stringData:
  url: "jdbc:postgresql://<host>:5432/<database>"
  username: "<db-username>"
  password: "<db-password>"
---
apiVersion: v1
kind: Secret
metadata:
  name: smw-mail-secret
type: Opaque
stringData:
  enabled: "false"
  username: "<mail-username>"
  password: "<mail-password>"
  from: "noreply@example.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: smw-app-secret
type: Opaque
stringData:
  jwt-signing-secret: "<replace-with-long-random-signing-secret>"
  jwt-encryption-key: "<16-or-24-or-32-char-key>"
---
apiVersion: v1
kind: Secret
metadata:
  name: smw-otel-secret
type: Opaque
stringData:
  otlp-headers: "Authorization=Basic <base64_encoded_userid:token>"
---
apiVersion: v1
kind: Secret
metadata:
  name: smw-grafana-secret
type: Opaque
stringData:
  # Grafana 스택 Service Account 토큰 (glsa_...) — git·이미지에 넣지 말 것
  # 스택 UI: Administration → Service accounts → Viewer 역할 → Add token
  # (Cloud Access Policy의 otel/metrics 토큰은 Grafana HTTP API에 쓸 수 없음)
  # 적용: kubectl apply -f secrets.template.yaml (값 치환 후) 또는
  #   kubectl create secret generic smw-grafana-secret --from-literal=access-token='glsa_...'
  # 이후: kubectl rollout restart deployment smw-app
  access-token: "<grafana-cloud-access-policy-token>"
