# smw-app 전용. 메모리 부족 시 배포: batch scale 0 -> 본 deployment 롤아웃 -> batch 1 -> 검증 -> batch 2 (k8s/DEPLOYMENT_ROLLOUT.md)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smw-app
  labels:
    app: smw-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smw-app
  template:
    metadata:
      labels:
        app: smw-app
    spec:
      # K3s 환경에서 Pod가 EC2 인스턴스의 IAM 역할을 사용할 수 있도록 설정
      # EC2 메타데이터 서비스(169.254.169.254)에 접근할 수 있도록 hostNetwork 사용
      # 또는 AWS SDK가 자동으로 EC2 인스턴스 메타데이터를 감지하도록 설정
      containers:
      - name: smw-app
        # SHA 기반 태그 사용 (이미지 변경 감지 명확화)
        # GitHub Actions에서 자동으로 업데이트됨: main-{sha} 형식
        image: gilhwanjeon/smw-app:latest
        imagePullPolicy: Always  # 항상 최신 이미지 가져오기 (latest 태그 사용 시 필수)
        ports:
        - containerPort: 8080
          name: http
        env:
        # S3: Kubernetes 시크릿 s3-credentials (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION)
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: AWS_REGION
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        # OS·JVM 기본 시간대 (Jackson JSON·로그·DB timestamp 해석 — UTC Pod와 로컬 차이 방지)
        - name: TZ
          value: "Asia/Seoul"
        - name: JAVA_TOOL_OPTIONS
          value: "-Duser.timezone=Asia/Seoul"
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx512m"
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: smw-db-secret
              key: url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: smw-db-secret
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smw-db-secret
              key: password
        - name: SPRING_DATASOURCE_HIKARI_USERNAME
          valueFrom:
            secretKeyRef:
              name: smw-db-secret
              key: username
        - name: SPRING_DATASOURCE_HIKARI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smw-db-secret
              key: password
        # 메일 설정 (선택)
        # - Secret(smw-mail-secret)이 없으면 메일 발송은 비활성화되며, 개발용 dev_code 응답을 사용할 수 있습니다.
        - name: SPRING_MAIL_ENABLED
          valueFrom:
            secretKeyRef:
              name: smw-mail-secret
              key: enabled
              optional: true
        - name: SPRING_MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: smw-mail-secret
              key: username
              optional: true
        - name: SPRING_MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smw-mail-secret
              key: password
              optional: true
        - name: SPRING_MAIL_FROM
          valueFrom:
            secretKeyRef:
              name: smw-mail-secret
              key: from
              optional: true
        - name: SMW_JWT_SIGNING_SECRET
          valueFrom:
            secretKeyRef:
              name: smw-app-secret
              key: jwt-signing-secret
              optional: true
        - name: SMW_JWT_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: smw-app-secret
              key: jwt-encryption-key
              optional: true
        # Grafana OpenTelemetry
        - name: OTEL_SERVICE_NAME
          valueFrom:
            secretKeyRef:
              name: smw-otel-secret
              key: otel-service-name
              optional: true
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: smw-otel-secret
              key: otlp-endpoint
              optional: true
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          valueFrom:
            secretKeyRef:
              name: smw-otel-secret
              key: otlp-protocol
              optional: true
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: smw-otel-secret
              key: otlp-headers
              optional: true
        # API Pod: Quartz 크론은 배치 Pod(smw-batch)에서만 등록. docker 만 — quartz-jdbc( JobStoreTX ) 미로드
        - name: SMW_BATCH_QUARTZ_ENABLED
          value: "false"
        # Quartz Scheduler.start() 자체를 끔 — 트리거 폴링/실행 없음(크론 미등록과 별도). 배치 Pod는 true
        - name: SPRING_QUARTZ_AUTO_STARTUP
          value: "false"
        # Spring @Scheduled — application-docker 기본 false. API는 미설정으로 off, 배치 Pod만 true
        # RTA 조회 캐시 — Redis(smw-redis Service) 공유, 배치가 갱신 후 워밍업
        - name: SPRING_DATA_REDIS_HOST
          value: "smw-redis"
        - name: SMW_CACHE_RTA_USE_REDIS
          value: "true"
        # 단일 노드/소형 EC2에서 Insufficient memory 스케줄 실패 시 requests·limits 낮춤 (kubectl describe node 로 allocatable 확인)
        resources:
          requests:
            memory: "512Mi"
            cpu: "400m"
          limits:
            memory: "768Mi"
            cpu: "1000m"
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 18
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: smw-app-service
  labels:
    app: smw-app
spec:
  type: NodePort
  selector:
    app: smw-app
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
    name: http

