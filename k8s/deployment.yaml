# smw-app 전용. 메모리 부족 시 배포: batch scale 0 -> 본 deployment 롤아웃 -> batch 1 -> 검증 -> batch 2 (k8s/DEPLOYMENT_ROLLOUT.md)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smw-app
  labels:
    app: smw-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smw-app
  template:
    metadata:
      labels:
        app: smw-app
    spec:
      # K3s 환경에서 Pod가 EC2 인스턴스의 IAM 역할을 사용할 수 있도록 설정
      # EC2 메타데이터 서비스(169.254.169.254)에 접근할 수 있도록 hostNetwork 사용
      # 또는 AWS SDK가 자동으로 EC2 인스턴스 메타데이터를 감지하도록 설정
      containers:
      - name: smw-app
        # SHA 기반 태그 사용 (이미지 변경 감지 명확화)
        # GitHub Actions에서 자동으로 업데이트됨: main-{sha} 형식
        image: gilhwanjeon/smw-app:latest
        imagePullPolicy: Always  # 항상 최신 이미지 가져오기 (latest 태그 사용 시 필수)
        ports:
        - containerPort: 8080
          name: http
        env:
        # S3: Kubernetes 시크릿 s3-credentials (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION)
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: AWS_REGION
        - name: SPRING_PROFILES_ACTIVE
          value: "docker,quartz-jdbc"
        - name: SPRING_QUARTZ_JOB_STORE_TYPE
          value: "jdbc"
        # OS·JVM 기본 시간대 (Jackson JSON·로그·DB timestamp 해석 — UTC Pod와 로컬 차이 방지)
        - name: TZ
          value: "Asia/Seoul"
        # t4g.medium(4GB): 힙 512m + Metaspace cap, limit 1Gi (768Mi는 off-heap·OTEL·Tomcat으로 OOMKilled 137 빈번)
        - name: JAVA_TOOL_OPTIONS
          value: "-Duser.timezone=Asia/Seoul -Xms384m -Xmx512m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "10"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "5"
        - name: SERVER_TOMCAT_THREADS_MAX
          value: "80"
        - name: SERVER_TOMCAT_THREADS_MIN_SPARE
          value: "10"
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: smw-db-secret
              key: url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: smw-db-secret
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smw-db-secret
              key: password
        - name: SPRING_DATASOURCE_HIKARI_USERNAME
          valueFrom:
            secretKeyRef:
              name: smw-db-secret
              key: username
        - name: SPRING_DATASOURCE_HIKARI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smw-db-secret
              key: password
        # 메일 설정 (선택)
        # - Secret(smw-mail-secret)이 없으면 메일 발송은 비활성화되며, 개발용 dev_code 응답을 사용할 수 있습니다.
        - name: SPRING_MAIL_ENABLED
          valueFrom:
            secretKeyRef:
              name: smw-mail-secret
              key: enabled
              optional: true
        - name: SPRING_MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: smw-mail-secret
              key: username
              optional: true
        - name: SPRING_MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smw-mail-secret
              key: password
              optional: true
        - name: SPRING_MAIL_FROM
          valueFrom:
            secretKeyRef:
              name: smw-mail-secret
              key: from
              optional: true
        - name: SMW_JWT_SIGNING_SECRET
          valueFrom:
            secretKeyRef:
              name: smw-app-secret
              key: jwt-signing-secret
              optional: true
        - name: SMW_JWT_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: smw-app-secret
              key: jwt-encryption-key
              optional: true
        # Grafana OpenTelemetry
        - name: OTEL_SERVICE_NAME
          valueFrom:
            secretKeyRef:
              name: smw-otel-secret
              key: otel-service-name
              optional: true
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: smw-otel-secret
              key: otlp-endpoint
              optional: true
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          valueFrom:
            secretKeyRef:
              name: smw-otel-secret
              key: otlp-protocol
              optional: true
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: smw-otel-secret
              key: otlp-headers
              optional: true
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
        - name: OTEL_METRICS_EXPORTER
          value: "otlp"
        - name: OTEL_LOGS_EXPORTER
          value: "otlp"
        - name: OTEL_LOG_LEVEL
          value: "warn"
        - name: OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT
          value: "8192"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "deployment.environment=production,service.namespace=smwr"
        # Grafana Cloud iframe 프록시 (Service Account glsa — Secret만)
        - name: SMW_GRAFANA_CLOUD_ENABLED
          value: "true"
        - name: SMW_GRAFANA_CLOUD_BASE_URL
          value: "https://sjrtjr3150.grafana.net"
        - name: SMW_GRAFANA_CLOUD_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: smw-grafana-secret
              key: access-token
              optional: false
        # API Pod: Quartz 크론은 smw-batch에서만. JDBC 클러스터 trigger-only로 수동 실행 → batch Pod 실행.
        - name: SMW_BATCH_QUARTZ_ENABLED
          value: "false"
        - name: SMW_BATCH_QUARTZ_TRIGGER_ONLY
          value: "true"
        - name: SMW_QUARTZ_THREAD_COUNT
          value: "1"
        # trigger-only Config가 start→standby. auto-startup false면 FactoryBean 미기동 → Config에서 start.
        - name: SPRING_QUARTZ_AUTO_STARTUP
          value: "false"
        # Spring @Scheduled — application-docker 기본 false. API는 미설정으로 off, 배치 Pod만 true
        # RTA 조회 캐시 — Redis(smw-redis Service) 공유, 배치가 갱신 후 워밍업
        - name: SPRING_DATA_REDIS_HOST
          value: "smw-redis"
        - name: SMW_CACHE_RTA_USE_REDIS
          value: "true"
        # Insufficient memory 방지: requests 합이 노드 allocatable 이내 (t4g.medium 기준 아래 DEPLOYMENT_ROLLOUT.md)
        resources:
          requests:
            memory: "512Mi"
            cpu: "300m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        # liveness만 검사 — DB·Redis 준비 전에도 포트 기동 여부 확인(메모리 압박 시 3s timeout 완화)
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 25
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: smw-app-service
  labels:
    app: smw-app
spec:
  type: NodePort
  selector:
    app: smw-app
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
    name: http

