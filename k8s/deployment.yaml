apiVersion: apps/v1
kind: Deployment
metadata:
  name: smw-app
  labels:
    app: smw-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smw-app
  template:
    metadata:
      labels:
        app: smw-app
    spec:
      # K3s 환경에서 Pod가 EC2 인스턴스의 IAM 역할을 사용할 수 있도록 설정
      # EC2 메타데이터 서비스(169.254.169.254)에 접근할 수 있도록 hostNetwork 사용
      # 또는 AWS SDK가 자동으로 EC2 인스턴스 메타데이터를 감지하도록 설정
      containers:
      - name: smw-app
        # SHA 기반 태그 사용 (이미지 변경 감지 명확화)
        # GitHub Actions에서 자동으로 업데이트됨: main-{sha} 형식
        image: gilhwanjeon/smw-app:latest
        imagePullPolicy: Always  # 항상 최신 이미지 가져오기 (latest 태그 사용 시 필수)
        ports:
        - containerPort: 8080
          name: http
        env:
        # S3: Kubernetes 시크릿 s3-credentials (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION)
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: AWS_REGION
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: smw-db-secret
              key: url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: smw-db-secret
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smw-db-secret
              key: password
        - name: SPRING_DATASOURCE_HIKARI_USERNAME
          valueFrom:
            secretKeyRef:
              name: smw-db-secret
              key: username
        - name: SPRING_DATASOURCE_HIKARI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smw-db-secret
              key: password
        # 메일 설정 (선택)
        # - Secret(smw-mail-secret)이 없으면 메일 발송은 비활성화되며, 개발용 dev_code 응답을 사용할 수 있습니다.
        - name: SPRING_MAIL_ENABLED
          valueFrom:
            secretKeyRef:
              name: smw-mail-secret
              key: enabled
              optional: true
        - name: SPRING_MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: smw-mail-secret
              key: username
              optional: true
        - name: SPRING_MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smw-mail-secret
              key: password
              optional: true
        - name: SPRING_MAIL_FROM
          valueFrom:
            secretKeyRef:
              name: smw-mail-secret
              key: from
              optional: true
        - name: SMW_JWT_SIGNING_SECRET
          valueFrom:
            secretKeyRef:
              name: smw-app-secret
              key: jwt-signing-secret
              optional: true
        - name: SMW_JWT_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: smw-app-secret
              key: jwt-encryption-key
              optional: true
        resources:
          requests:
            memory: "768Mi"
            cpu: "500m"
          limits:
            memory: "1.5Gi"
            cpu: "1000m"
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 18
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: smw-app-service
  labels:
    app: smw-app
spec:
  type: NodePort
  selector:
    app: smw-app
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
    name: http

