
spring:
  application:
    name: smw
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cache:
    type: caffeine
    caffeine:
      # monster-list 같은 "거의 고정" 데이터는 WAS 메모리 캐시로 DB 타격을 제거
      spec: maximumSize=1000,expireAfterWrite=7d,recordStats
  batch:
    job:
      enabled: true
  datasource:
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    hikari:
      maximum-pool-size: 30 # 배치 작업 병렬 처리 고려하여 증가
      minimum-idle: 10 # 최소 유휴 연결 개수 증가
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 60000 # 커넥션 누수 감지 (60초)
  servlet:
    multipart.max-file-size: 20MB
    max-request-size: 25MB
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          ssl:
            trust: "*"
          enable: true
        debug: false
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
        type: trace
        dialect: org.hibernate.dialect.PostgreSQL95Dialect
        log:
          use_sql_comments: true

mybatis:
  type-aliases-package: com.summonerswar
  config-location: classpath:mybatis/mybatis-config.xml
  mapper-locations: classpath*:com/**/mapper/xml/*.xml

server:
  port: 8080
  tomcat:
    min-spare-threads: 40
  servlet:
    session:
      timeout: 3600
      cookie:
        http-only: true

logging:
  level:
    org.springframework.boot.autoconfigure: WARN
    org.springframework.boot.autoconfigure.condition: WARN
    org.springframework.boot: WARN
    org.springframework.web: WARN
    org.springframework.orm: WARN
    org.springframework.transaction: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    jdbc.sqlonly: OFF
    jdbc.sqltiming: DEBUG
    jdbc.resultsettable: OFF
    com.smw.guild.mapper: INFO
    com.sysconf.interceptor: INFO
    org.apache.coyote: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

smw:
  globalDblinkNm: SMW_DBLINK
  cookie-live-time: 600
  rate-limit:
    max-requests: 1000
    window-seconds: 60
  cache:
    provider: caffeine
  mybatis:
    log:
      inline-sql: ${SMW_MYBATIS_INLINE_SQL:true}
      result-total: ${SMW_MYBATIS_RESULT_TOTAL:false}

cloud:
  aws:
    s3:
      bucket: summonerswar-community
    region:
      static: ap-southeast-2
    stack:
      auto: false
    credentials:
      instance-profile: true