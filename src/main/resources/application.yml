
spring:
  application:
    name: smw
  # @Scheduled(RtaExporterFullLogIngestScheduler 등). 개발/도커/운영 프로필은 보통 false — SMW_SCHEDULER_ENABLED=true 로 켬
  task:
    scheduling:
      enabled: ${SMW_SCHEDULER_ENABLED:true}
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER  # Spring 6 PathPattern 대신 ANT 스타일 허용 (/**/*.js 등)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cache:
    type: caffeine
    caffeine:
      # monster-list 같은 "거의 고정" 데이터는 WAS 메모리 캐시로 DB 타격을 제거
      spec: maximumSize=1000,expireAfterWrite=7d,recordStats
  batch:
    jdbc:
      # PostgreSQL 에 BATCH_* 메타 테이블 생성 (운영은 never + 마이그레이션 권장)
      initialize-schema: always
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      # 배치·API 공유 풀. 너무 크면 DB max_connections·I/O 경합 — 부하는 smw.rta.* 상한으로 조절
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:28}
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      # 120초마다 Hikari가 idle 커넥션에 SELECT 1 전송 → NAT 350초 timeout 이전에 갱신
      keepalive-time: 120000
      leak-detection-threshold: ${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD:0}
      # PostgreSQL: PreparedStatement 배치를 멀티-INSERT로 재작성 → 왕복·파싱 부담 감소(MyBatis ExecutorType.BATCH 와 함께 권장)
      # MySQL 계열은 JDBC URL 에 rewriteBatchedStatements=true (Hikari data-source-properties 가 아님)
      # driver-class-name(DriverManager 모드)에서는 data-source-properties 가 무시됨.
      # connection-init-sql 로 커넥션 생성 시 세션 파라미터를 직접 설정한다.
      # tcp_keepalives_idle=60  : 60초 idle 후 keepalive probe 전송 (NAT 5분 timeout 이전에 갱신)
      # tcp_keepalives_interval : probe 재전송 간격(초)
      # tcp_keepalives_count    : 무응답 허용 횟수
      connection-init-sql: >
        SELECT set_config('tcp_keepalives_idle',              '60',      false),
               set_config('tcp_keepalives_interval',          '10',      false),
               set_config('tcp_keepalives_count',             '6',       false),
               set_config('lock_timeout',                     '120000',  false),
               set_config('idle_in_transaction_session_timeout', '300000', false)
      data-source-properties:
        reWriteBatchedInserts: ${SPRING_DATASOURCE_REWRITE_BATCHED_INSERTS:true}
        # JDBC 소켓 레벨 keepalive — tcp_keepalives_idle은 PG 서버 측만 적용, 클라이언트 소켓은 별도 설정 필요
        # AWS NAT Gateway 350초 idle timeout: socketTimeout=600으로 COPY/MERGE 긴 작업도 커버
        tcpKeepAlive: true
        socketTimeout: ${SPRING_DATASOURCE_SOCKET_TIMEOUT:600}
  servlet:
    # 아레나 rta-upload(JSON body)·멀티파트 등 대용량 — 필요 시 SMW_MULTIPART_* 로 상향
    multipart.max-file-size: ${SMW_MULTIPART_MAX_FILE_SIZE:512MB}
    max-request-size: ${SMW_MULTIPART_MAX_REQUEST_SIZE:512MB}
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          ssl:
            trust: "*"
          enable: true
        debug: false
  jpa:
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        use_sql_comments: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

mybatis:
  type-aliases-package: com.summonerswar
  config-location: classpath:mybatis/mybatis-config.xml
  mapper-locations: classpath*:com/**/mapper/xml/*.xml,classpath*:com/**/batch/queue/xml/*.xml

server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
  tomcat:
    min-spare-threads: 40
    # JSON @RequestBody(rta-upload arenaJson 등) — SMW_SERVER_MAX_HTTP_POST_SIZE 로 상향
    max-http-post-size: ${SMW_SERVER_MAX_HTTP_POST_SIZE:512MB}
  servlet:
    session:
      timeout: 3600
      cookie:
        http-only: true

# log4jdbc(local/dev/docker 프로필) 사용 시 jdbc.* 로거 — log4j2-spring.xml 의 jdbc.sqltiming 과 함께 Spring 이 부트 시 레벨 적용
#
# 왜 쿼리가 안 보일 수 있나:
# - 기본 spring.datasource 는 postgresql 직접 드라이버 → log4jdbc 미사용 → jdbc.sqlonly/sqltiming 로그 없음 (local/dev 에서 log4jdbc URL 일 때만).
# - jdbc.sqlonly: OFF 이면 문장 로그 차단 — local/dev 에서 INFO/DEBUG 로 덮어씀.
# - log4jdbc.log4j2: log4j2-spring.xml 에서 WARN — INFO 이면 ResultSet 컬럼 읽기마다 한 줄(불필요·I/O 부담).
# - MyBatis 코어 SQL 로그는 NoLoggingImpl 로 끔 — SQL(inlined)·log4jdbc 만 사용(Preparing 중복 없음).
logging:
  level:
    org.springframework.boot.autoconfigure: WARN
    org.springframework.boot.autoconfigure.condition: WARN
    org.springframework.boot: WARN
    org.springframework.web: WARN
    org.springframework.orm: WARN
    org.springframework.transaction: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    jdbc.sqlonly: OFF
    jdbc.sqltiming: WARN
    jdbc.resultset: OFF
    jdbc.resultsettable: OFF
    log4jdbc.log4j2: WARN
    com.smw.guild.mapper: INFO
    com.sysconf.interceptor: INFO
    org.apache.coyote: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db
      probes:
        enabled: true
      show-details: when_authorized
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        smw.api.request.duration: true
        smw.swarfarm.client.duration: true
        smw.batch.execution.duration: true
        smw.swarfarm.sync.duration: true

smw:
  # DB 연결 단절 감지 주기 (ms). 0 이하로 설정하면 @Scheduled 오류 — 비활성화 시 SMW_DB_MONITOR_ENABLED=false
  db-monitor:
    check-interval-ms: ${SMW_DB_MONITOR_CHECK_INTERVAL_MS:30000}
  # Quartz 크론만 제어: false 면 DB sys_batch_config 크론 미등록. 수동 실행(/api/v1/batch/run)은 Scheduler 있으면 동작.
  # true: 로컬(application-local)·docker(application-docker) 등에서 켬. 운영 prod 는 보통 false + 수동/별도 워커.
  batch:
    quartz:
      enabled: ${SMW_BATCH_QUARTZ_ENABLED:false}
      # smw-app + quartz-jdbc: JDBC 클러스터 트리거만(standby). Job 실행은 smw-batch.
      trigger-only: ${SMW_BATCH_QUARTZ_TRIGGER_ONLY:false}
    log:
      redis-bridge-enabled: ${SMW_BATCH_LOG_REDIS_BRIDGE:true}
      sse-timeout-ms: ${SMW_BATCH_LOG_SSE_TIMEOUT_MS:7200000}
    manual-run:
      wait-timeout-ms: ${SMW_BATCH_MANUAL_RUN_WAIT_TIMEOUT_MS:7200000}
      appear-timeout-ms: ${SMW_BATCH_MANUAL_RUN_APPEAR_TIMEOUT_MS:120000}
      poll-interval-ms: ${SMW_BATCH_MANUAL_RUN_POLL_INTERVAL_MS:2000}
    run-his:
      stale-cleanup-enabled: ${SMW_BATCH_RUN_HIS_STALE_CLEANUP:true}
      stale-running-hours: ${SMW_BATCH_RUN_HIS_STALE_HOURS:6}
  globalDblinkNm: SMW_DBLINK
  cookie-live-time: 2592000
  # SYS_ROLE/SYS_USER_ROLE 제거 시: 관리자 user_id 목록(콤마 구분). RequireAdmin·알림 수신·댓글 삭제 등
  admin-user-ids: ${SMW_ADMIN_USER_IDS:}
  # S3: smw.aws.* → S3Service 정적 키 사용
  # - 로컬: src/main/resources/application-local.yml (Git 제외, application-local.example.yml 참고)
  # - K8s(docker): Deployment에서 s3-credentials 시크릿 → AWS_* 환경변수로 주입
  aws:
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    region: ${AWS_REGION:ap-southeast-2}
  # S3 업로드 후 공개 URL(CloudFront) 접두 — API 응답의 상대 icon_path 등을 절대 URL로 붙일 때 사용
  cdn:
    public-base-url: ${SMW_CDN_PUBLIC_BASE_URL:https://dyjduzi8vf2k4.cloudfront.net}
  security:
    jwt-signing-secret: ${SMW_JWT_SIGNING_SECRET}
    jwt-encryption-key: ${SMW_JWT_ENCRYPTION_KEY}
    access-token-valid-time-ms: ${SMW_ACCESS_TOKEN_VALID_TIME_MS:10800000}
    auth:
      login-max-attempts: ${SMW_AUTH_LOGIN_MAX_ATTEMPTS:5}
      login-lock-minutes: ${SMW_AUTH_LOGIN_LOCK_MINUTES:15}
      login-failure-delay-ms-min: ${SMW_AUTH_LOGIN_FAIL_DELAY_MS_MIN:300}
      login-failure-delay-ms-max: ${SMW_AUTH_LOGIN_FAIL_DELAY_MS_MAX:800}
      password-min-length: ${SMW_AUTH_PASSWORD_MIN_LENGTH:8}
      password-max-length: ${SMW_AUTH_PASSWORD_MAX_LENGTH:128}
  http-client:
    connect-timeout-ms: ${SMW_HTTP_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${SMW_HTTP_READ_TIMEOUT_MS:10000}
  rate-limit:
    max-requests: 1000
    window-seconds: 60
    auth-login-max-requests: ${SMW_RATE_LIMIT_AUTH_LOGIN_MAX:10}
    auth-login-window-seconds: ${SMW_RATE_LIMIT_AUTH_LOGIN_WINDOW:60}
    auth-signup-max-requests: ${SMW_RATE_LIMIT_AUTH_SIGNUP_MAX:5}
    auth-signup-window-seconds: ${SMW_RATE_LIMIT_AUTH_SIGNUP_WINDOW:300}
    auth-email-max-requests: ${SMW_RATE_LIMIT_AUTH_EMAIL_MAX:8}
    auth-email-window-seconds: ${SMW_RATE_LIMIT_AUTH_EMAIL_WINDOW:3600}
  swarfarm:
    image-download-concurrency: ${SMW_SWARFARM_IMAGE_DOWNLOAD_CONCURRENCY:4}
    request-delay-ms: ${SMW_SWARFARM_REQUEST_DELAY_MS:250}
    # 스킬 동기화: 자식 행 INSERT·버퍼 플러시 시 한 번에 넣는 행 수
    db-batch-size: ${SMW_SWARFARM_DB_BATCH_SIZE:250}
    # 스킬 동기화: 이 개수마다 DB 커밋 (트랜잭션 분리, 타임아웃·롤백 범위 축소)
    commit-chunk-size: ${SMW_SWARFARM_COMMIT_CHUNK_SIZE:100}
    http:
      max-attempts: ${SMW_SWARFARM_HTTP_MAX_ATTEMPTS:3}
      retry-backoff-ms: ${SMW_SWARFARM_HTTP_RETRY_BACKOFF_MS:400}
  cache:
    short-lived:
      maximum-size: ${SMW_SHORT_CACHE_MAXIMUM_SIZE:2000}
      expire-after-write-minutes: ${SMW_SHORT_CACHE_EXPIRE_AFTER_WRITE_MINUTES:5}
    rta-list-read:
      maximum-size: ${SMW_RTA_LIST_READ_CACHE_MAXIMUM_SIZE:3000}
      expire-after-write-minutes: ${SMW_RTA_LIST_READ_CACHE_EXPIRE_MINUTES:15}
    rta-player:
      # 플레이어 summary/snap — 랭킹·티어보다 변화 적으므로 TTL 길게 유지
      maximum-size: ${SMW_RTA_PLAYER_CACHE_MAXIMUM_SIZE:5000}
      expire-after-write-minutes: ${SMW_RTA_PLAYER_CACHE_EXPIRE_MINUTES:30}
      page-data-l1:
        maximum-size: ${SMW_RTA_PAGE_DATA_L1_MAXIMUM_SIZE:4000}
        expire-after-write-minutes: ${SMW_RTA_PAGE_DATA_L1_EXPIRE_MINUTES:5}
    rta:
      # false: Caffeine(로컬). prod/docker 프론트에서 true. 로컬은 application-local.yml
      use-redis: ${SMW_CACHE_RTA_USE_REDIS:false}
      # @Cacheable rtaMonster 전용(솔/듀/트 목록, 상세, 대시보드 link-preview) — rtaShortLived(5m)과 분리
      monster:
        expire-after-write-minutes: ${SMW_CACHE_RTA_MONSTER_EXPIRE_MINUTES:60}
        maximum-size: ${SMW_CACHE_RTA_MONSTER_MAXIMUM_SIZE:200}
  # Summoners War Exporter full_log (로그 수집 PC에서만 enabled=true)
  # 대량 백필·처리량 상향: spring.profiles.active 에 bulkload 추가 → application-bulkload.yml
  rta:
    orphan-cleanup:
      lookback-hours: ${SMW_RTA_ORPHAN_CLEANUP_LOOKBACK_HOURS:48}
      replay-id-padding: ${SMW_RTA_ORPHAN_CLEANUP_REPLAY_ID_PADDING:100000}
      # 0=일요일 전수 스캔(레거시 점검), 월~토는 최근 replay_id 구간만. -1=전수 스캔 끔
      full-scan-day-of-week: ${SMW_RTA_ORPHAN_CLEANUP_FULL_SCAN_DOW:0}
    exporter:
      enabled: ${SMW_RTA_EXPORTER_ENABLED:false}
      watch-directory: ${SMW_RTA_EXPORTER_WATCH_DIR:}
    raw-apply:
      max-rows-per-run: ${SMW_RTA_RAW_APPLY_MAX_ROWS:1000}
      max-batches-per-job: ${SMW_RTA_RAW_APPLY_MAX_BATCHES:1}
      max-batches-cap: ${SMW_RTA_RAW_APPLY_MAX_BATCHES_CAP:20}
      apply-chunk-size: ${SMW_RTA_RAW_APPLY_CHUNK_SIZE:1000}
      evict-caches-each-chunk: ${SMW_RTA_RAW_APPLY_EVICT_EACH_CHUNK:false}
      bulk-rid-temp-index-threshold: ${SMW_RTA_RAW_APPLY_BULK_RID_TEMP_INDEX_THRESHOLD:5000}
      fail-fast-on-error: ${SMW_RTA_RAW_APPLY_FAIL_FAST:true}
    batch:
      synergy-batch-size: ${SMW_RTA_SYNERGY_BATCH_SIZE:10000}
      synergy-max-rounds-per-job: ${SMW_RTA_SYNERGY_MAX_ROUNDS_PER_JOB:1}
      synergy-max-rounds-cap: ${SMW_RTA_SYNERGY_MAX_ROUNDS_CAP:10}
      pick-slot-drain-batch-size: ${SMW_RTA_PICK_SLOT_DRAIN_BATCH_SIZE:2000}
      pick-slot-max-rounds-cap: ${SMW_RTA_PICK_SLOT_MAX_ROUNDS_CAP:10}
      backlog-scaling-enabled: ${SMW_RTA_BATCH_BACKLOG_SCALING:true}
      exact-pending-count-in-batch-jobs: ${SMW_RTA_BATCH_EXACT_PENDING_COUNT_IN_JOBS:false}
      pending-count-cache-ttl-seconds: ${SMW_RTA_BATCH_PENDING_COUNT_CACHE_TTL:300}
      backlog-high-watermark: ${SMW_RTA_BATCH_BACKLOG_HIGH_WATERMARK:10000}
      synergy-pause-ms-between-rounds: ${SMW_RTA_SYNERGY_PAUSE_MS:50}
      synergy-max-wall-clock-ms-per-job: ${SMW_RTA_SYNERGY_MAX_WALL_CLOCK_MS:0}
      slack-token: ${SMW_BATCH_SLACK_TOKEN:}
      slack-channel-id: ${SMW_BATCH_SLACK_CHANNEL_ID:}
      rank-cut-missing-hours-per-run: ${SMW_RTA_RANK_CUT_MISSING_HOURS_PER_RUN:48}
      skip-season-rating-match-total-if-fresh: ${SMW_RTA_SKIP_MATCH_TOTAL_IF_FRESH:true}
    synergy-agg:
      # 디스크 여유가 작은 환경에서 staging 파일 급증 방지(기존 600k)
      copy-staging-chunk-rows: ${SMW_RTA_SYNERGY_AGG_COPY_STAGING_CHUNK_ROWS:200000}
      # applySynergyBatch(라운드당 N rid) 를 더 짧은 TX 로 분할 — 단일 TX 수 시간·I/O 끊김 완화
      apply-sub-batch-size: ${SMW_RTA_SYNERGY_APPLY_SUB_BATCH_SIZE:1000}
    counter-agg:
      # 디스크 여유가 작은 환경에서 staging 파일 급증 방지(기존 400k)
      copy-staging-chunk-rows: ${SMW_RTA_COUNTER_AGG_COPY_STAGING_CHUNK_ROWS:120000}
      # true 시 merge 직후 counter 3테이블 FULL ANALYZE — 대형 DB에서 시너지 배치가 수 시간 늘어남
      analyze-target-after-merge: ${SMW_RTA_COUNTER_AGG_ANALYZE_AFTER_MERGE:false}
    # rank-cut-validation · counter/synergy-agg · staging-merge → Java @ConfigurationProperties / @Value 기본값
    # 대시보드 API: rta_agg_* / rta_rank_cutoff_anchor_snap 등 집계·스냅만 (라이브 풀스캔 없음).
  ops:
    thresholds:
      heap-warning-percent: ${SMW_OPS_HEAP_WARNING_PERCENT:75}
      heap-critical-percent: ${SMW_OPS_HEAP_CRITICAL_PERCENT:90}
      process-cpu-warning-percent: ${SMW_OPS_PROCESS_CPU_WARNING_PERCENT:70}
      process-cpu-critical-percent: ${SMW_OPS_PROCESS_CPU_CRITICAL_PERCENT:90}
      system-cpu-warning-percent: ${SMW_OPS_SYSTEM_CPU_WARNING_PERCENT:80}
      system-cpu-critical-percent: ${SMW_OPS_SYSTEM_CPU_CRITICAL_PERCENT:95}
      thread-warning-count: ${SMW_OPS_THREAD_WARNING_COUNT:250}
      thread-critical-count: ${SMW_OPS_THREAD_CRITICAL_COUNT:400}
      gc-pause-warning-ms: ${SMW_OPS_GC_PAUSE_WARNING_MS:500}
      gc-pause-critical-ms: ${SMW_OPS_GC_PAUSE_CRITICAL_MS:1500}
      api-error-rate-warning-percent: ${SMW_OPS_API_ERROR_RATE_WARNING_PERCENT:3}
      api-error-rate-critical-percent: ${SMW_OPS_API_ERROR_RATE_CRITICAL_PERCENT:10}
      api-slow-rate-warning-percent: ${SMW_OPS_API_SLOW_RATE_WARNING_PERCENT:5}
      api-slow-rate-critical-percent: ${SMW_OPS_API_SLOW_RATE_CRITICAL_PERCENT:15}
  grafana:
    cloud:
      enabled: ${SMW_GRAFANA_CLOUD_ENABLED:true}
      base-url: ${SMW_GRAFANA_CLOUD_BASE_URL:https://sjrtjr3150.grafana.net}
      access-token: ${SMW_GRAFANA_CLOUD_ACCESS_TOKEN:}
      dashboards:
        - id: smwr
          title: SMWR 서비스
          description: WAS API · JVM · HTTP (OpenTelemetry / Prometheus)
          uid: ${SMW_GRAFANA_DASHBOARD_WAS_UID:}
          slug: ${SMW_GRAFANA_DASHBOARD_WAS_SLUG:smwr-was}
        - id: batch
          title: 배치
          description: smw-batch · Quartz · Spring Batch
          uid: ${SMW_GRAFANA_DASHBOARD_BATCH_UID:}
          slug: ${SMW_GRAFANA_DASHBOARD_BATCH_SLUG:smwr-batch}
  mybatis:
    log:
      # true: MybatisInterceptor 가 ? 를 값으로 치환한 SQL(inlined) 를 INFO 로 출력 (전 매퍼·별도 로거 DEBUG 불필요)
      inline-sql: ${SMW_MYBATIS_INLINE_SQL:false}
      result-total: ${SMW_MYBATIS_RESULT_TOTAL:false}
    interceptor:
      # /api/v1/batch 요청 처리 중 intercept start/end·siege DEBUG 생략 (배치 수동 실행 시 노이즈 감소)
      silent-trace-on-batch-api: ${SMW_MYBATIS_INTERCEPTOR_SILENT_BATCH_API:true}

cloud:
  aws:
    s3:
      bucket: summonerswar-community
    region:
      static: ap-southeast-2
    stack:
      auto: false
    credentials:
      instance-profile: true