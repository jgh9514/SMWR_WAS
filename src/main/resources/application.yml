
spring:
  application:
    name: smw
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER  # Spring 6 PathPattern 대신 ANT 스타일 허용 (/**/*.js 등)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:bulkload}
  cache:
    type: caffeine
    caffeine:
      # monster-list 같은 "거의 고정" 데이터는 WAS 메모리 캐시로 DB 타격을 제거
      spec: maximumSize=1000,expireAfterWrite=7d,recordStats
  batch:
    job:
      # JobLauncher 로만 실행 권장 (부팅 시 전체 Job 자동 실행 방지)
      enabled: false
    jdbc:
      # PostgreSQL 에 BATCH_* 메타 테이블 생성 (운영은 never + 마이그레이션 권장)
      initialize-schema: always
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30 # 배치 작업 병렬 처리 고려하여 증가
      minimum-idle: 10 # 최소 유휴 연결 개수 증가
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: ${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD:0}
  servlet:
    # 아레나 rta-upload(JSON body)·멀티파트 등 대용량 — 필요 시 SMW_MULTIPART_* 로 상향
    multipart.max-file-size: ${SMW_MULTIPART_MAX_FILE_SIZE:512MB}
    max-request-size: ${SMW_MULTIPART_MAX_REQUEST_SIZE:512MB}
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          ssl:
            trust: "*"
          enable: true
        debug: false
  jpa:
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        use_sql_comments: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

mybatis:
  type-aliases-package: com.summonerswar
  config-location: classpath:mybatis/mybatis-config.xml
  mapper-locations: classpath*:com/**/mapper/xml/*.xml

server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
  tomcat:
    min-spare-threads: 40
    # JSON @RequestBody(rta-upload arenaJson 등) — SMW_SERVER_MAX_HTTP_POST_SIZE 로 상향
    max-http-post-size: ${SMW_SERVER_MAX_HTTP_POST_SIZE:512MB}
  servlet:
    session:
      timeout: 3600
      cookie:
        http-only: true

# log4jdbc(local/dev/docker 프로필) 사용 시 jdbc.* 로거 — log4j2-spring.xml 의 jdbc.sqltiming 과 함께 Spring 이 부트 시 레벨 적용
logging:
  level:
    org.springframework.boot.autoconfigure: WARN
    org.springframework.boot.autoconfigure.condition: WARN
    org.springframework.boot: WARN
    org.springframework.web: WARN
    org.springframework.orm: WARN
    org.springframework.transaction: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    jdbc.sqlonly: OFF
    jdbc.sqltiming: INFO
    jdbc.resultsettable: OFF
    com.smw.guild.mapper: INFO
    com.sysconf.interceptor: INFO
    org.apache.coyote: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db
      probes:
        enabled: true
      show-details: when_authorized
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        smw.api.request.duration: true
        smw.swarfarm.client.duration: true
        smw.batch.execution.duration: true
        smw.swarfarm.sync.duration: true

smw:
  globalDblinkNm: SMW_DBLINK
  cookie-live-time: 600
  # SYS_ROLE/SYS_USER_ROLE 제거 시: 관리자 user_id 목록(콤마 구분). RequireAdmin·알림 수신·댓글 삭제 등
  admin-user-ids: ${SMW_ADMIN_USER_IDS:}
  # S3: smw.aws.* → S3Service 정적 키 사용
  # - 로컬: src/main/resources/application-local.yml (Git 제외, application-local.example.yml 참고)
  # - K8s(docker): Deployment에서 s3-credentials 시크릿 → AWS_* 환경변수로 주입
  aws:
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    region: ${AWS_REGION:ap-southeast-2}
  # S3 업로드 후 공개 URL(CloudFront) 접두 — API 응답의 상대 icon_path 등을 절대 URL로 붙일 때 사용
  cdn:
    public-base-url: ${SMW_CDN_PUBLIC_BASE_URL:https://dyjduzi8vf2k4.cloudfront.net}
  security:
    jwt-signing-secret: ${SMW_JWT_SIGNING_SECRET}
    jwt-encryption-key: ${SMW_JWT_ENCRYPTION_KEY}
    access-token-valid-time-ms: ${SMW_ACCESS_TOKEN_VALID_TIME_MS:10800000}
  http-client:
    connect-timeout-ms: ${SMW_HTTP_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${SMW_HTTP_READ_TIMEOUT_MS:10000}
  rate-limit:
    max-requests: 1000
    window-seconds: 60
  swarfarm:
    image-download-concurrency: ${SMW_SWARFARM_IMAGE_DOWNLOAD_CONCURRENCY:4}
    request-delay-ms: ${SMW_SWARFARM_REQUEST_DELAY_MS:250}
    # 스킬 동기화: 자식 행 INSERT·버퍼 플러시 시 한 번에 넣는 행 수
    db-batch-size: ${SMW_SWARFARM_DB_BATCH_SIZE:250}
    # 스킬 동기화: 이 개수마다 DB 커밋 (트랜잭션 분리, 타임아웃·롤백 범위 축소)
    commit-chunk-size: ${SMW_SWARFARM_COMMIT_CHUNK_SIZE:100}
    http:
      max-attempts: ${SMW_SWARFARM_HTTP_MAX_ATTEMPTS:3}
      retry-backoff-ms: ${SMW_SWARFARM_HTTP_RETRY_BACKOFF_MS:400}
  cache:
    provider: caffeine
    short-lived:
      maximum-size: ${SMW_SHORT_CACHE_MAXIMUM_SIZE:500}
      expire-after-write-minutes: ${SMW_SHORT_CACHE_EXPIRE_AFTER_WRITE_MINUTES:5}
  # Summoners War Exporter full_log 로컬 폴더 감시 (로그 수집 PC에서만 켬 — UI 테스트 PC는 enabled: false 유지)
  # 감시 시 원본 JSON만 스테이징 적재, 정규화는 RtaUnifiedPipelineAggJob(bat_id 10001) 등 배치
  # 전량 재적재·백필: spring.profiles.active 에 bulkload 추가 → application-bulkload.yml (또는 SMW_RTA_RAW_APPLY_MAX_ROWS 등 상향)
  rta:
    exporter:
      enabled: ${SMW_RTA_EXPORTER_ENABLED:false}
      watch-directory: ${SMW_RTA_EXPORTER_WATCH_DIR:}
      temp-subdir: ${SMW_RTA_EXPORTER_TEMP_SUBDIR:temp}
      file-name-prefix: ${SMW_RTA_EXPORTER_FILE_PREFIX:full_log}
      poll-interval-ms: ${SMW_RTA_EXPORTER_POLL_MS:300000}
      # 5분마다 시작하는 감시 구간 길이(ms). 이 안에서만 아래 간격으로 폴더 반복 스캔.
      poll-burst-duration-ms: ${SMW_RTA_EXPORTER_BURST_MS:60000}
      # 한 구간 안에서 폴더 스캔(후보 탐색) 사이 대기(ms)
      poll-scan-interval-ms: ${SMW_RTA_EXPORTER_SCAN_INTERVAL_MS:20000}
      # 0 이하 = full_log 크기 검사 안 함(무제한). 양수 = MB 단위 상한. 무제한은 힙·메모리 주의
      max-file-size-mb: ${SMW_RTA_EXPORTER_MAX_MB:0}
      # 후보 파일 한 번 처리 시 크기 안정화(연속 두 샘플 간격·상한)
      stable-millis: ${SMW_RTA_EXPORTER_STABLE_MS:2000}
      stable-max-wait-ms: ${SMW_RTA_EXPORTER_STABLE_MAX_MS:60000}
    raw-apply:
      # 정규화 배치(RtaUnifiedPipelineAggJob 등) 한 실행당 DB에서 꺼내 처리할 pending/failed 최대 건수
      max-rows-per-run: ${SMW_RTA_RAW_APPLY_MAX_ROWS:1000}
      # 한 트랜잭션에 묶어 rta_match 등에 넣는 건수(최소 1). 상한 없음.
      apply-chunk-size: ${SMW_RTA_RAW_APPLY_CHUNK_SIZE:80}
    # 통합 RTA 배치(스냅샷·시너지 라운드 크기 등). 처리량·락 경합 트레이드오프.
    batch:
      synergy-batch-size: ${SMW_RTA_SYNERGY_BATCH_SIZE:200}
      snapshot-batch-size: ${SMW_RTA_SNAPSHOT_BATCH_SIZE:3000}
      skip-legacy-snapshot-step: ${SMW_RTA_BATCH_SKIP_SNAPSHOT:false}
  ops:
    thresholds:
      heap-warning-percent: ${SMW_OPS_HEAP_WARNING_PERCENT:75}
      heap-critical-percent: ${SMW_OPS_HEAP_CRITICAL_PERCENT:90}
      process-cpu-warning-percent: ${SMW_OPS_PROCESS_CPU_WARNING_PERCENT:70}
      process-cpu-critical-percent: ${SMW_OPS_PROCESS_CPU_CRITICAL_PERCENT:90}
      system-cpu-warning-percent: ${SMW_OPS_SYSTEM_CPU_WARNING_PERCENT:80}
      system-cpu-critical-percent: ${SMW_OPS_SYSTEM_CPU_CRITICAL_PERCENT:95}
      thread-warning-count: ${SMW_OPS_THREAD_WARNING_COUNT:250}
      thread-critical-count: ${SMW_OPS_THREAD_CRITICAL_COUNT:400}
      gc-pause-warning-ms: ${SMW_OPS_GC_PAUSE_WARNING_MS:500}
      gc-pause-critical-ms: ${SMW_OPS_GC_PAUSE_CRITICAL_MS:1500}
      api-error-rate-warning-percent: ${SMW_OPS_API_ERROR_RATE_WARNING_PERCENT:3}
      api-error-rate-critical-percent: ${SMW_OPS_API_ERROR_RATE_CRITICAL_PERCENT:10}
      api-slow-rate-warning-percent: ${SMW_OPS_API_SLOW_RATE_WARNING_PERCENT:5}
      api-slow-rate-critical-percent: ${SMW_OPS_API_SLOW_RATE_CRITICAL_PERCENT:15}
  mybatis:
    log:
      inline-sql: ${SMW_MYBATIS_INLINE_SQL:false}
      result-total: ${SMW_MYBATIS_RESULT_TOTAL:false}

cloud:
  aws:
    s3:
      bucket: summonerswar-community
    region:
      static: ap-southeast-2
    stack:
      auto: false
    credentials:
      instance-profile: true