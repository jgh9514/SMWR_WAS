# Docker 환경 설정 (SPRING_PROFILES_ACTIVE=docker 로 활성화)
# Quartz: 배치 Pod(smw-batch)는 SMW_QUARTZ_JOB_STORE_TYPE 미설정 → jdbc+클러스터(여러 replica 안전).
# API Pod(smw-app)는 memory 로 두어 QRTZ에 참여·크론 뺏어가기를 막는다(아래 k8s deployment env).
# QRTZ_* 테이블: sql/postgresql_qrtz_tables.sql 을 DB에 1회 적용 후 batch 기동.
spring:
  quartz:
    job-store-type: ${SMW_QUARTZ_JOB_STORE_TYPE:jdbc}
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceName: smwQuartz
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.class: org.quartz.impl.jdbcjobstore.JobStoreTX
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.useProperties: false
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.misfireThreshold: 120000
      org.quartz.threadPool.threadCount: 12
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  application:
    name: smw
  task:
    scheduling:
      enabled: ${SMW_SCHEDULER_ENABLED:false}
  # K8s(UTC Pod)에서도 날짜 JSON이 한국 시각 기준으로 직렬화되도록 (TZ·JAVA_TOOL_OPTIONS와 함께)
  jackson:
    time-zone: Asia/Seoul
  batch:
    jdbc:
      # K8s(docker) 환경: log4jdbc URL(jdbc:log4jdbc:postgresql://...) 을 DatabaseDriver 가 인식 못해
      # "Failed to determine DatabaseDriver" 발생 방지.
      # 배치 메타 테이블(BATCH_JOB_INSTANCE 등)은 최초 always 실행 또는 수동 DDL로 이미 생성되어 있음.
      initialize-schema: never
      platform: postgresql
    job:
      # Spring Batch Job 빈이 여러 개(rtaReplayPipelineJob 등) — true 면 기동 시 Job 이름 미지정으로 실패할 수 있음.
      # Quartz 스케줄은 smw.batch.quartz.enabled (또는 SMW_BATCH_QUARTZ_ENABLED). NDJSON Job 은 JobLauncher 로만 실행.
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # log4jdbc 사용 시 DriverSpy 필요 (jdbc:log4jdbc:postgresql://... 형식)
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    # 쿠버네티스 환경에서는 시크릿에서 값을 가져옵니다 (deployment.yaml 참조)
    # 로컬 개발 환경에서는 환경 변수 또는 기본값을 사용합니다
    url: ${SPRING_DATASOURCE_URL:jdbc:log4jdbc:postgresql://localhost:5432/dummy_db}
    hikari:
      username: ${SPRING_DATASOURCE_USERNAME:dummy_user}
      password: ${SPRING_DATASOURCE_PASSWORD:dummy_password}
      maximum-pool-size: 30 # 배치 작업 병렬 처리 고려하여 증가 (페이지 처리 3개 * 각 페이지마다 여러 DB 작업 + 일반 요청 여유)
      minimum-idle: 10 # 최소 유휴 연결 개수 증가 (배치 작업 대비)
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: ${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD:0}
      data-source-properties:
        reWriteBatchedInserts: ${SPRING_DATASOURCE_REWRITE_BATCHED_INSERTS:true}
  servlet:
    multipart.max-file-size: ${SMW_MULTIPART_MAX_FILE_SIZE:512MB}
    max-request-size: ${SMW_MULTIPART_MAX_REQUEST_SIZE:512MB}
  mail:
    # 쿠버네티스/개발 서버에서는 환경변수로 제어 (기본 false 권장)
    enabled: ${SPRING_MAIL_ENABLED:${MAIL_ENABLED:false}}
    host: smtp.gmail.com
    port: 587
    # 쿠버네티스 환경에서는 시크릿에서 값을 가져옵니다
    # 로컬 개발 환경에서는 환경 변수를 사용하세요
    # 표준 Spring 환경변수(SPRING_MAIL_*)와 커스텀(MAIL_*) 둘 다 지원
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
    from: ${SPRING_MAIL_FROM:${MAIL_FROM:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          ssl:
            trust: "*"
          enable: true
        debug: false
  jpa:
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        use_sql_comments: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

mybatis:
  type-aliases-package: com.summonerswar
  config-location: classpath:mybatis/mybatis-config.xml
  mapper-locations: classpath*:com/**/mapper/xml/*.xml

server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
  tomcat:
    min-spare-threads: 40
    max-http-post-size: ${SMW_SERVER_MAX_HTTP_POST_SIZE:512MB}
  servlet:
    session:
      timeout: 3600
      cookie:
        http-only: true

logging:
  level:
    org.springframework.boot.autoconfigure: WARN
    org.springframework.boot.autoconfigure.condition: WARN
    org.springframework.boot: WARN
    org.springframework.web: WARN
    org.springframework.orm: WARN
    org.springframework.transaction: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    jdbc.sqlonly: OFF
    jdbc.sqltiming: WARN
    jdbc.resultsettable: OFF
    # MyBatis "==> Preparing/Parameters/Total" 로그 억제
    com.smw.guild.mapper: INFO
    com.sysconf.interceptor: INFO
    # Tomcat HTTP 파싱 에러 로그 레벨 조정 (HTTPS 요청이 HTTP 포트로 들어올 때 발생하는 에러)
    org.apache.coyote: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false  # 메일 헬스 체크 비활성화 (메일 인증 실패로 인한 DOWN 방지)
    redis:
      enabled: ${SMW_CACHE_RTA_USE_REDIS:false}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        smw.api.request.duration: true
        smw.swarfarm.client.duration: true
        smw.batch.execution.duration: true
        smw.swarfarm.sync.duration: true

smw:
  # Quartz(BatchConfig): 기본 OFF — API/WAS만 띄울 때 크론 미등록. 배치 전용 Pod 에서만 SMW_BATCH_QUARTZ_ENABLED=true
  batch:
    quartz:
      enabled: ${SMW_BATCH_QUARTZ_ENABLED:false}
  service-domain: localhost, localhost:3000, 13.236.20.39:32282, jgh9514.com, www.jgh9514.com
  globalDblinkNm: SMW_DBLINK
  front-url: http://localhost:3000
  server-url: http://localhost:8080
  cookie-live-time: 600
  cookie-domain: jgh9514.com
  rate-limit:
    max-requests: 1000  # Rate Limit 완화 (1분당 최대 1000회)
    window-seconds: 60
  cache:
    provider: caffeine
    short-lived:
      maximum-size: ${SMW_SHORT_CACHE_MAXIMUM_SIZE:500}
      expire-after-write-minutes: ${SMW_SHORT_CACHE_EXPIRE_AFTER_WRITE_MINUTES:5}
    rta:
      # K8s: Redis Service 호스트 + true 권장. Redis 없이 docker 프로필만 쓸 때는 false
      use-redis: ${SMW_CACHE_RTA_USE_REDIS:false}
  ops:
    thresholds:
      heap-warning-percent: ${SMW_OPS_HEAP_WARNING_PERCENT:75}
      heap-critical-percent: ${SMW_OPS_HEAP_CRITICAL_PERCENT:90}
      process-cpu-warning-percent: ${SMW_OPS_PROCESS_CPU_WARNING_PERCENT:70}
      process-cpu-critical-percent: ${SMW_OPS_PROCESS_CPU_CRITICAL_PERCENT:90}
      system-cpu-warning-percent: ${SMW_OPS_SYSTEM_CPU_WARNING_PERCENT:80}
      system-cpu-critical-percent: ${SMW_OPS_SYSTEM_CPU_CRITICAL_PERCENT:95}
      thread-warning-count: ${SMW_OPS_THREAD_WARNING_COUNT:250}
      thread-critical-count: ${SMW_OPS_THREAD_CRITICAL_COUNT:400}
      gc-pause-warning-ms: ${SMW_OPS_GC_PAUSE_WARNING_MS:500}
      gc-pause-critical-ms: ${SMW_OPS_GC_PAUSE_CRITICAL_MS:1500}
      api-error-rate-warning-percent: ${SMW_OPS_API_ERROR_RATE_WARNING_PERCENT:3}
      api-error-rate-critical-percent: ${SMW_OPS_API_ERROR_RATE_CRITICAL_PERCENT:10}
      api-slow-rate-warning-percent: ${SMW_OPS_API_SLOW_RATE_WARNING_PERCENT:5}
      api-slow-rate-critical-percent: ${SMW_OPS_API_SLOW_RATE_CRITICAL_PERCENT:15}
  swarfarm:
    image-download-concurrency: ${SMW_SWARFARM_IMAGE_DOWNLOAD_CONCURRENCY:4}
  mybatis:
    log:
      # "파라미터까지 합쳐진 완성된 SQL" 로그 (MybatisInterceptor DEBUG에서 출력)
      inline-sql: ${SMW_MYBATIS_INLINE_SQL:false}
      # 조회 쿼리 결과(total row count) 로그는 기본 비활성화
      result-total: ${SMW_MYBATIS_RESULT_TOTAL:false}

# AWS S3: smw.aws.* 는 application.yml 에서 ${AWS_ACCESS_KEY_ID} 등으로 주입
# K8s에서는 Deployment가 시크릿 s3-credentials 를 환경변수로 마운트함
cloud:
  aws:
    s3:
      bucket: summonerswar-community
    region:
      static: ap-southeast-2  # S3 버킷이 시드니 리전에 있으므로 일치시킴
    stack:
      auto: false # 중요: K8s 환경에서 불필요한 스택 감지 방지
    # IAM 역할(인스턴스 프로파일)을 사용하도록 강제 설정
    credentials:
      instance-profile: true

