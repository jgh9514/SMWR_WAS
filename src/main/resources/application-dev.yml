# 로컬/개발 프로필 — Log4j2 설정 고정 (application.yml 의 jdbc.sqlonly:OFF 덮어씀)
logging:
  config: classpath:log4j2-spring.xml
  level:
    jdbc.sqlonly: INFO
    jdbc.sqltiming: DEBUG
    log4jdbc.log4j2: DEBUG
    com.sysconf.interceptor.MybatisInterceptor: DEBUG

spring:
  datasource:
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url: ${SPRING_DATASOURCE_URL:jdbc:log4jdbc:postgresql://13.236.20.39:30432/summonerswar}
    hikari:
      leak-detection-threshold: 60000
      username: ${SPRING_DATASOURCE_USERNAME:postgres}
      password: ${SPRING_DATASOURCE_PASSWORD:}
  mail:
    enabled: ${SPRING_MAIL_ENABLED:false}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    from: ${SPRING_MAIL_FROM:noreply@example.com}
    properties:
      mail:
        debug: true

smw:
  mybatis:
    log:
      inline-sql: true
  security:
    jwt-signing-secret: ${SMW_JWT_SIGNING_SECRET}
    jwt-encryption-key: ${SMW_JWT_ENCRYPTION_KEY}
  service-domain: localhost, localhost:3000, jgh9514.github.io
  front-url: http://localhost:3000
  server-url: http://localhost:8080
  cookie-domain: jgh9514.github.io
