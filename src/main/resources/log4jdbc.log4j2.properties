############################################
# log4jdbc-log4j2 configuration
# (classpath: log4jdbc.log4j2.properties)
############################################

# Use Log4j2 delegator (log4j2-spring.xml 로 출력)
log4jdbc.spylogdelegator.name=net.sf.log4jdbc.log.log4j2.Log4j2SpyLogDelegator

# Pretty/clean SQL output
log4jdbc.trim.sql=true
# 0(무제한)일 경우, 특정 쿼리/IN-list/바인딩이 길어지면 단일 로그 라인이 Grafana OTLP(256KB) 제한을 초과할 수 있음.
log4jdbc.dump.sql.maxlinelength=8192
log4jdbc.dump.sql.addsemicolon=true
log4jdbc.dump.sql.select=true
log4jdbc.dump.sql.insert=true
log4jdbc.dump.sql.update=true
log4jdbc.dump.sql.delete=true
log4jdbc.dump.sql.create=true
log4jdbc.dump.sql.drop=true
log4jdbc.dump.sql.other=true

# Reduce noisy stack traces
log4jdbc.dump.fulldebugstacktrace=false

# (Optional) Focus stack traces on application packages
# log4jdbc.debug.stack.prefix=com.