---
# local 프로파일 (기본) - DB는 dev(원격) 사용, Redis 미사용
spring:
  profiles: local
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  batch:
    job:
      enabled: true  # 배치 Config 로드 (수동 실행 API 사용)
    scheduler:
      enabled: false  # 로컬: 스케줄러 자동 시작 비활성화
  datasource:
    url: jdbc:log4jdbc:postgresql://13.236.20.39:30432/summonerswar
    hikari:
      username: postgres
      password: '@@jgh15963'

smw:
  service-domain: localhost, localhost:3000
  cookie-domain: localhost
  cookie-live-time: 600
  front-url: http://localhost:3000
  server-url: http://localhost:8080

---
# dev 프로파일 (배포 시 -Dspring.profiles.active=dev)
spring:
  profiles: dev
  batch:
    job:
      enabled: true
    scheduler:
      enabled: true  # dev: 스케줄러 자동 시작
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:log4jdbc:postgresql://13.236.20.39:30432/summonerswar}
    hikari:
      username: ${SPRING_DATASOURCE_USERNAME:postgres}
      password: '${SPRING_DATASOURCE_PASSWORD:@@jgh15963}'

smw:
  service-domain: jgh9514.com, www.jgh9514.com, admin.jgh9514.com
  cookie-domain: jgh9514.com
  cookie-live-time: 600
  front-url: https://jgh9514.com
  server-url: https://admin.jgh9514.com

---
# 공통 설정
spring:
  application:
    name: smw
  profiles:
    active: local
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=7d,recordStats
  batch:
    job:
      enabled: true
  datasource:
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 60000
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    timeout: 2000ms
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:smwr-was}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.smw.*
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.smw.infra.kafka.event.SiegeUploadedEvent
  servlet:
    multipart.max-file-size: 20MB
    max-request-size: 25MB
  mail:
    enabled: true
    host: smtp.gmail.com
    port: 587
    username: jgh9514@gmail.com
    password: 'evelmayasqjjymwh'
    from: jgh9514@gmail.com
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          ssl:
            trust: "*"
          enable: true
        debug: true
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
        type: trace
        dialect: org.hibernate.dialect.PostgreSQL95Dialect
        log:
          use_sql_comments: true

mybatis:
  type-aliases-package: com.summonerswar
  config-location: classpath:mybatis/mybatis-config.xml
  mapper-locations: classpath*:com/**/mapper/xml/*.xml

server:
  port: 8081
  tomcat:
    min-spare-threads: 40
  servlet:
    session:
      timeout: 3600
      cookie:
        http-only: true

logging:
  level:
    org.springframework.boot.autoconfigure: WARN
    org.springframework.boot.autoconfigure.condition: WARN
    org.springframework.boot: WARN
    org.springframework.web: WARN
    org.springframework.orm: WARN
    org.springframework.transaction: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    jdbc.sqlonly: OFF
    jdbc.sqltiming: DEBUG
    jdbc.resultsettable: OFF
    com.smw.guild.mapper: INFO
    com.sysconf.interceptor: INFO
    org.apache.coyote: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

smw:
  globalDblinkNm: SMW_DBLINK
  rate-limit:
    max-requests: 1000
    window-seconds: 60
  cache:
    provider: ${SMW_CACHE_PROVIDER:caffeine}
  kafka:
    enabled: ${SMW_KAFKA_ENABLED:false}
    topics:
      siege-uploaded: ${SMW_KAFKA_TOPIC_SIEGE_UPLOADED:smwr.siege.uploaded}
  mybatis:
    log:
      inline-sql: ${SMW_MYBATIS_INLINE_SQL:true}
      result-total: ${SMW_MYBATIS_RESULT_TOTAL:false}

cloud:
  aws:
    s3:
      bucket: summonerswar-community
    region:
      static: ap-southeast-2
    stack:
      auto: false
    credentials:
      instance-profile: true
