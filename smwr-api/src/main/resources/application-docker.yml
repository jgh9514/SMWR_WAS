spring:
  application:
    name: smwr-api
  profiles:
    active: docker
  batch:
    job:
      enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:log4jdbc:postgresql://localhost:5432/dummy_db}
    hikari:
      username: ${SPRING_DATASOURCE_USERNAME:dummy_user}
      password: ${SPRING_DATASOURCE_PASSWORD:dummy_password}
  redis:
    host: ${SPRING_REDIS_HOST:redis}
    port: ${SPRING_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      properties:
        spring.json.trusted.packages: com.smw.*
        spring.json.value.default.type: com.smw.common.event.SiegeUploadedEvent
  mail:
    enabled: ${SPRING_MAIL_ENABLED:false}

server:
  port: 8080

smw:
  service-domain: localhost, localhost:3000, 13.236.20.39:32282, jgh9514.com, www.jgh9514.com
  front-url: http://localhost:3000
  server-url: http://localhost:8080
  cache:
    provider: ${SMW_CACHE_PROVIDER:redis}
  kafka:
    enabled: ${SMW_KAFKA_ENABLED:true}
    topics:
      siege-uploaded: ${SMW_KAFKA_TOPIC_SIEGE_UPLOADED:smwr.siege.uploaded}
